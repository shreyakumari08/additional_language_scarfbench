micronaut.application.name=producerfields
micronaut.server.port=8080
micronaut.server.context-path=/producerfields

datasources.default.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1
datasources.default.driver-class-name=org.h2.Driver
datasources.default.username=sa
datasources.default.password=password
datasources.default.dialect=H2

jpa.default.packages-to-scan[0]=micronaut.tutorial.producerfields.entity
jpa.default.properties.hibernate.hbm2ddl.auto=create
jpa.default.properties.hibernate.show_sql=true
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
